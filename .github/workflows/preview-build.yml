name: Preview Build

# Builds a standalone "preview" APK on manual dispatch.
# The preview variant is a non-debuggable build with none of the debug-only tooling
# (no LeakCanary/StrictMode/debug settings/ACRA-debug) and its own applicationId suffix, so it
# installs alongside the store build. R8/resource shrinking is intentionally OFF so the APK
# installs cleanly when sideloaded. It's signed with the same release keystore as the release workflow
# (KEYSTORE_BASE64, RELEASE_* secrets), so previews update over each other. Without the secrets it
# falls back to the runner's throwaway debug key.
#
# One APK per ABI (arm64-v8a, armeabi-v7a, x86_64, x86) plus a universal one, each published as its own
# workflow artifact (zipped by GitHub). File names and SHA-256 hashes are printed to the run summary.
on:
  workflow_dispatch:

permissions:
  contents: read

# Only keep the latest preview build per branch/ref running.
concurrency:
  group: preview-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build preview APKs
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "HAS_KEYSTORE=true" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 is not set, signing with the runner's debug key"
          fi

      - name: Build preview APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          ARGS=()
          if [ "${HAS_KEYSTORE:-}" = "true" ]; then
            ARGS+=(
              -PRELEASE_STORE_FILE=../release.keystore
              -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD"
              -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS"
              -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD"
            )
          fi
          ./gradlew :app:assemblePreview --no-daemon --stacktrace "${ARGS[@]}"

      - name: Collect APKs and compute checksums
        id: apk
        run: |
          set -euo pipefail
          shopt -s nullglob
          SHORT_SHA=$(git rev-parse --short HEAD)
          SAFE_REF=$(echo "${GITHUB_REF_NAME}" | tr '/ ' '__')
          BASE="SlopSauce-preview-${SAFE_REF}-${SHORT_SHA}"
          mkdir -p out

          {
            echo "**Preview build of \`${GITHUB_REF_NAME}\`** — non-debuggable, no dev tooling, installs"
            echo "as a separate app (\`org.haziffe.dropsauce.preview\`, \"SlopSauce Preview\")."
            echo ""
            echo "| File | Size | SHA-256 |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          for ABI in arm64-v8a armeabi-v7a x86_64 x86 universal; do
            FILES=(app/build/outputs/apk/preview/*-"${ABI}"-*.apk)
            if [ ${#FILES[@]} -ne 1 ]; then
              echo "::error::Expected exactly one ${ABI} APK under app/build/outputs/apk/preview, found ${#FILES[@]}"
              exit 1
            fi
            DEST="out/${BASE}-${ABI}.apk"
            cp "${FILES[0]}" "$DEST"
            SHA256=$(sha256sum "$DEST" | awk '{print $1}')
            SIZE=$(du -h "$DEST" | cut -f1)
            echo "| \`$(basename "$DEST")\` | ${SIZE} | \`${SHA256}\` |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.base }}-arm64-v8a
          path: out/${{ steps.apk.outputs.base }}-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.base }}-armeabi-v7a
          path: out/${{ steps.apk.outputs.base }}-armeabi-v7a.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.base }}-x86_64
          path: out/${{ steps.apk.outputs.base }}-x86_64.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload x86 APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.base }}-x86
          path: out/${{ steps.apk.outputs.base }}-x86.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.base }}-universal
          path: out/${{ steps.apk.outputs.base }}-universal.apk
          if-no-files-found: error
          retention-days: 30
